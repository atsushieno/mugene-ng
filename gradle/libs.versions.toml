[versions]
agp = "8.12.3"
android-compileSdk = "36"
android-minSdk = "23"
android-targetSdk = "35"
androidx-activityCompose = "1.9.3"
androidx-appcompat = "1.7.0"
androidx-core-ktx = "1.15.0"
androidx-espresso-core = "3.6.1"
androidx-test-junit = "1.2.1"
compose = "1.7.6"
compose-plugin = "1.6.11"
junit = "4.13.2"
kotlin = "2.3.0"
dokka = "2.1.0"
binary-compatibility-validator = "0.18.1"
antlr-kotlin = "1.0.9"
npm-publish = "4.1.9"

junit-jupiter-api = "5.10.0"
kotlin-test-junit = "1.9.0"
kotlinx-coroutines-core = "1.10.2"
ktor-io = "3.0.0"
gradle-javacpp = "1.5.10"
startup-runtime = "1.2.0"

ktmidi = "0.11.2"
mugene = "0.7.1"

vanniktech-maven-publish = "0.35.0"

[libraries]
ktmidi = { module = "dev.atsushieno:ktmidi", version.ref = "ktmidi" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
antlr-kotlin-runtime = { module = "com.strumenta:antlr-kotlin-runtime", version.ref = "antlr-kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup-runtime" }
[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
gradleJavacppBuild = { id = "org.bytedeco.gradle-javacpp-build", version.ref = "gradle-javacpp" }
gradleJavacppPlatform = { id = "org.bytedeco.gradle-javacpp-platform", version.ref = "gradle-javacpp" }
npmPublish = { id = "org.danilopianini.npm.publish", version.ref = "npm-publish" }
antlrKotlinPlugin = { id = "com.strumenta.antlr-kotlin", version.ref = "antlr-kotlin" }
binaryCompatibilityValidatorPlugin = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }

[bundles]

